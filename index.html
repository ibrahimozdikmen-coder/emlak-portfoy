const normal=s=>String(s||'').toLocaleLowerCase('tr-TR').trim();
const roomCount=s=>+((String(s||'').match(/\d+/)||[])[0]||0);
function floorMatch(l,s){if(!s||s==='Fark etmez')return true;if(s==='Giriş kat veya üzeri (zemin/bodrum olmasın)')return !/bodrum|zemin/i.test(l.floor||'');if(s==='Sadece giriş kat')return /giriş/i.test(l.floor||'');if(s==='Sadece ara kat')return /^\d+\. kat$/i.test(l.floor||'');if(s==='Ara kat veya yüksek kat'||s==='Yüksek kat tercih'||s==='Asansörlü üst kat')return /kat/i.test(l.floor||'');if(s==='Zemin kat olur')return /zemin|giriş|kat/i.test(l.floor||'');if(s==='Bodrum kat olur')return /bodrum|zemin|giriş|kat/i.test(l.floor||'');if(s==='Çatı katı / dubleks')return /çatı|dubleks/i.test(l.floor||'');return true}
function frontMatch(listing,request){const wanted=normal(request);if(!wanted||wanted==='fark etmez')return true;const listed=normal(listing);if(!listed)return false;if(listed.includes(wanted)||wanted.includes(listed))return true;const words=wanted.split(/[^a-zçğıöşü]+/i).filter(w=>w.length>2&&!['cephe','manzara','manzaralı'].includes(w));return words.length>0&&words.every(w=>listed.includes(w))}
function siteNameMatch(listing,request){const wanted=normal(request);if(!wanted||wanted==='fark etmez')return true;const listed=normal(listing);return !!listed&&(listed.includes(wanted)||wanted.includes(listed))}
function listingMatches(l,s){
  if(l.status==='Satıldı'||l.status==='Kiralandı')return false;
  if(s.kind&&s.kind!=='Fark etmez'&&s.kind!==l.kind)return false;
  if(s.type&&s.type!=='Fark etmez'&&normal(s.type)!==normal(l.propertyType||'Daire'))return false;
  if(s.rooms&&s.rooms!=='Fark etmez'){const sr=roomCount(s.rooms),lr=roomCount(l.rooms);if(s.rooms.includes('ve üzeri')?lr<sr:normal(s.rooms)!==normal(l.rooms))return false}
  if(s.homeStyle&&s.homeStyle!=='Fark etmez'&&normal(s.homeStyle)!==normal(l.homeStyle||'Düz daire'))return false;
  if(s.site&&s.site!=='Fark etmez'&&normal(s.site)!==normal(l.site))return false;
  if(!siteNameMatch(l.siteName,s.siteName))return false;
  if(!frontMatch(l.front,s.front))return false;
  if(s.minM2&&(+l.m2||0)<+s.minM2)return false;if(s.maxM2&&(+l.m2||0)>+s.maxM2)return false;
  if(s.minBudget&&(+l.price||0)<+s.minBudget)return false;if(s.maxBudget&&(+l.price||0)>+s.maxBudget)return false;
  if(s.exactFloor&&s.exactFloor!=='Fark etmez'&&normal(s.exactFloor)!==normal(l.floor))return false;
  return floorMatch(l,s);
}

  vm(key){const parts=String(key||'').split('|'),l=L.find(x=>x.id===parts[0]),s=S.find(x=>x.id===parts[1]);if(!l||!s)return alert('Eşleşen kayıt artık bulunamadı.');modal('<h2>Uygun müşteri bulundu</h2><div class="kv"><b>Portföy</b>'+esc(l.title)+' · '+esc([l.rooms,l.site,l.front,money(l.price)].filter(Boolean).join(' · '))+'</div><div class="kv"><b>Müşteri</b>'+esc(s.name)+' · <a href="'+phoneLink(s.phone)+'" style="color:var(--ac)">'+esc(phoneInput(s.phone))+'</a></div><div class="kv"><b>Talebi</b>'+esc([s.rooms,s.site,s.front,s.maxBudget?money(s.maxBudget)+' bütçe':''].filter(Boolean).join(' · '))+'</div><div class="acts"><button class="btn g" data-a="x">Kapat</button><button class="btn g" data-a="vl" data-i="'+l.id+'">Portföyü aç</button><button class="btn" data-a="vs" data-i="'+s.id+'">Müşteriyi aç</button></div>')},
  va(i){const a=A.find(y=>y.id===i);if(!a)return;const l=L.find(y=>y.id===a.listing);
    modal('<h2>Randevu</h2><div class="kv"><b>Müşteri</b>'+esc(a.customer)+(a.phone?' · <a href="'+phoneLink(a.phone)+'" style="color:var(--ac)">'+esc(phoneInput(a.phone))+'</a>':'')+'</div>'+
    '<div class="kv"><b>Zaman</b>'+dl(a.start)+' · '+hm(a.start)+'</div><div class="kv"><b>Durum</b>'+esc(appointmentStatusText(a))+'</div><div class="kv"><b>Randevuyu alan</b>'+esc(nm(a.by))+'</div>'+
    (l?'<div class="kv"><b>Daire</b>'+esc(l.title)+' — '+esc(l.address||'')+'</div>':'')+(a.note?'<div class="kv"><b>Not</b>'+esc(a.note)+'</div>':'')+
    '<div class="acts"><button class="btn g" data-a="x">Kapat</button>'+(appointmentStatus(a)==='Planlandı'?'<button class="btn" data-a="adone" data-i="'+a.id+'">Tamamla — geldi</button><button class="btn d" data-a="amiss" data-i="'+a.id+'">Gelmedi / iptal</button>':'')+'</div><div class="acts"><button class="btn g" data-a="ea" data-i="'+a.id+'">Düzenle</button><button class="btn d" data-a="da" data-i="'+a.id+'">Sil</button></div>')},
  async adone(i){const a=A.find(y=>y.id===i);if(!a||!confirm('Bu randevuya müşterinin geldiğini işaretleyelim mi?'))return;const {id,...data}=a;await replace('appointments',a,Object.assign(data,{outcome:'Tamamlandı'}))},
  async amiss(i){const a=A.find(y=>y.id===i);if(!a||!confirm('Bu randevuyu gelmedi / iptal olarak işaretleyelim mi?'))return;const {id,...data}=a;await replace('appointments',a,Object.assign(data,{outcome:'Gelmedi / İptal'}))},
  async dl(i){if(confirm('Bu daire silinsin mi?')){try{await db.doc('listings/'+i).delete();closeM()}catch(e){alert('Silinemedi')}}},
  async da(i){if(confirm('Bu randevu silinsin mi?')){try{await db.doc('appointments/'+i).delete();cancelAndroidReminder(i);closeM()}catch(e){alert('Silinemedi')}}},
  async notif(){moreOpen=false;render();push(true)},
  async go(i){const e=v('g_e').trim(),p=v('g_p'),n=v('g_n').trim(),E=t=>{$('#ge').textContent=t};
    if(!e||p.length<6)return E('E-posta ve en az 6 karakterli şifre gerekli.');
    if(i!=='1'&&!n)return E('Ad Soyad gerekli.');
    const signupOptions={data:{name:n}},redirectTo=location.protocol==='https:'?location.origin+location.pathname:'';if(redirectTo)signupOptions.emailRedirectTo=redirectTo;
    let r;try{r=i==='1'?await sb.auth.signInWithPassword({email:e,password:p}):await sb.auth.signUp({email:e,password:p,options:signupOptions})}catch(err){return E('Sunucuya bağlanılamadı. İnternetinizi kontrol edip tekrar deneyin.')}
    if(r.error){const m=String(r.error.message||'');if(/rate limit/i.test(m))return E('Çok fazla deneme yapıldı. Birkaç dakika bekleyip tekrar deneyin.');if(/already registered|already been registered/i.test(m))return E('Bu e-posta ile kayıt zaten var. “Zaten hesabım var” seçeneğinden giriş yapın.');return E('Kayıt yapılamadı: '+m)}
    if(i!=='1'&&r.data.user&&Array.isArray(r.data.user.identities)&&!r.data.user.identities.length)return E('Bu e-posta ile kayıt zaten var. “Zaten hesabım var” seçeneğinden giriş yapın.');
    if(!r.data.session)return E('Kayıt oluşturuldu. E-postanıza gelen onay bağlantısını (spam klasörünü de kontrol edin) açın; ardından giriş yapın.');
    boot(r.data.session)},
  sw(i){showAuth(i==='1')},
  async out(){await sb.auth.signOut();location.reload()}
};
document.addEventListener('click',e=>{
  if(e.target.id==='m')return closeM();
  const t=e.target.closest('[data-a]');if(t&&act[t.dataset.a])act[t.dataset.a](t.dataset.i)});
document.addEventListener('keydown',e=>{if($('#viewer').hidden)return;if(e.key==='Escape')act.closeViewer();if(e.key==='ArrowLeft')act.photoPrev();if(e.key==='ArrowRight')act.photoNext()});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;render()}if(e.target.id==='f_month'){finMonth=e.target.value||dk(new Date()).slice(0,7);render()}if(['f_p','f_rp','s_bn','s_bx','m_am'].includes(e.target.id))e.target.value=priceInput(e.target.value);if(['f_ph','s_p','a_p','c_n','u_p'].includes(e.target.id))e.target.value=phoneInput(e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='p_cat'){portfolioCategory=e.target.value||'Tümü';render()}});

/* Hatırlatmalar: randevudan 1 saat önce + her gün 10:00 özeti (sayfa/uygulama açıkken) */
function toast(msg,fn){const d=document.createElement('div');d.className='ti';d.textContent=msg;d.onclick=()=>{d.remove();fn()};$('#ts').appendChild(d);setTimeout(()=>d.remove(),60000)}
function ping(a,msg,localScheduled){
  toast(msg,()=>act.va(a.id));
  try{if(localScheduled&&window.AndroidApp&&typeof window.AndroidApp.scheduleReminder==='function')return}catch(e){}
  try{if(window.AndroidApp&&typeof window.AndroidApp.notify==='function'){window.AndroidApp.notify('Randevu hatırlatma',msg,a.id);return}}catch(e){}
  try{if('Notification' in window&&Notification.permission==='granted'){const n=new Notification('Randevu hatırlatma',{body:msg});n.onclick=()=>{window.focus();act.va(a.id)}}}catch(e){}
}
const msg=a=>nm(a.by)+' bugün saat '+hm(a.start)+'’da '+a.customer+' ile randevunuz var.';
function scheduleAndroidReminder(a){try{if(!a||appointmentStatus(a)!=='Planlandı'||a.by!==me||!window.AndroidApp||typeof window.AndroidApp.scheduleReminder!=='function')return;const start=new Date(a.start).getTime(),now=Date.now();if(!Number.isFinite(start)||start<=now)return;window.AndroidApp.scheduleReminder(a.id,msg(a),String(Math.max(now+3000,start-3600000)))}catch(e){}}
function cancelAndroidReminder(id){try{if(window.AndroidApp&&typeof window.AndroidApp.cancelReminder==='function')window.AndroidApp.cancelReminder(id)}catch(e){}}
function scheduleAndroidReminders(){A.forEach(scheduleAndroidReminder)}
function tick(){
  const now=new Date(),td=dk(now);
  A.filter(a=>appointmentStatus(a)==='Planlandı').forEach(a=>{const d=new Date(a.start)-now;if(d>0&&d<=3600e3&&!seen('h'+a.id)){mark('h'+a.id);ping(a,'1 saat kaldı: '+msg(a),true)}});
  if(now.getHours()>=10&&!seen('d'+td)&&A.some(a=>appointmentStatus(a)==='Planlandı')){
    mark('d'+td);
    A.filter(a=>appointmentStatus(a)==='Planlandı'&&a.start.slice(0,10)===td&&new Date(a.start)>now).sort((a,b)=>a.start<b.start?-1:1).forEach(a=>ping(a,msg(a)));
  }
}

function showAuth(sig){$('#au').hidden=false;$('#au').innerHTML='<div class="box"><img class="login-brand" src="logo.png" alt="Armax Gayrimenkul">'+(sig?'':fld('Ad Soyad *','g_n'))+fld('E-posta','g_e','email')+fld('Şifre (en az 6 karakter)','g_p','password')+'<div id="ge" class="mu" style="color:var(--wa);margin-top:8px"></div><div class="acts"><button class="btn" data-a="go" data-i="'+(sig?1:0)+'">'+(sig?'Giriş yap':'Kayıt ol')+'</button></div><div class="acts"><button class="btn g" data-a="sw" data-i="'+(sig?0:1)+'">'+(sig?'Hesabım yok, kayıt ol':'Zaten hesabım var')+'</button></div></div>'}
async function boot(s){
  me=s.user.id;$('#au').hidden=true;
  sub('listings',x=>L=x);sub('appointments',x=>{A=x;scheduleAndroidReminders()});sub('seekers',x=>S=x);sub('calls',x=>C=x);sub('finances',x=>F=x);
  sub('users',x=>{U={};x.forEach(u=>U[u.id]=u);if(!reg){reg=1;if(!U[me])auto(s)}});
  if(navigator.serviceWorker)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.open){pend=e.data.open;render()}});
  push(false).catch(()=>{});
  tick();if(!tickTimer)tickTimer=setInterval(tick,60000);
}
async function auto(s){const n=(s.user.user_metadata||{}).name;if(n){try{await db.doc('users/'+me).set({name:n,role:'Yönetici',at:Date.now()})}catch(e){}}else act.prof()}
const b64=s=>{const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function push(ask){
  try{if(window.AndroidApp&&typeof window.AndroidApp.enableNotifications==='function'){window.AndroidApp.enableNotifications();return}}catch(e){}
  if(!('serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window)){if(ask)alert('Bu tarayıcı bildirimi desteklemiyor. iPhone’da önce Safari’de Paylaş → “Ana Ekrana Ekle” yapın, uygulamayı ana ekrandaki simgeden açın.');return}
  if(!CFG.vapid){if(ask)alert('Bildirim anahtarı henüz ayarlanmamış.');return}
  const w=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
  if(Notification.permission!=='granted'){if(!ask)return;if(await Notification.requestPermission()!=='granted')return}
  const ps=(await w.pushManager.getSubscription())||(await w.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(CFG.vapid)}));
  const r=await sb.from('push_subs').upsert({endpoint:ps.toJSON().endpoint,sub:ps.toJSON()});
  if(r.error){if(ask)alert('Kaydedilemedi: '+r.error.message);return}
  $('#bn').hidden=true;if(ask)alert('Bildirimler açıldı ✅');
}
if(window.AndroidApp){if(!sb)$('#main').innerHTML='<p class="empty">config.js dosyasına Supabase bilgilerinizi yazın.</p>';
else sb.auth.getSession().then(r=>r.data.session?boot(r.data.session):showAuth(true));}
