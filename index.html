<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emlak Portföy</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#1d5fd1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Emlak"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef4fd;--card:#fff;--tx:#10243f;--mu:#5a6f8c;--ac:#1d5fd1;--acx:#fff;--bd:#d3e2f6;--wa:#c62828}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1726;--card:#14233a;--tx:#e6eefb;--mu:#93a7c4;--ac:#5b9bff;--acx:#06162e;--bd:#223555;--wa:#ff8a84;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1726;--card:#14233a;--tx:#e6eefb;--mu:#93a7c4;--ac:#5b9bff;--acx:#06162e;--bd:#223555;--wa:#ff8a84;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 8px;max-width:760px;margin:auto}
h1{font-size:19px;margin:0;color:var(--ac)}
nav{display:flex;gap:6px;padding:0 16px 10px;max-width:760px;margin:auto}
nav button{flex:1;padding:9px 6px;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:10px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
main{max-width:760px;margin:auto;padding:0 16px 90px}
.bar{display:flex;gap:8px;margin-bottom:12px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12.5px;color:var(--mu);margin:10px 0 4px}
.btn{border:0;background:var(--ac);color:var(--acx);padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:transparent;color:var(--wa);border:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden;display:flex;cursor:pointer}
.card .im{width:104px;min-height:96px;background:var(--bd);flex:none}.card .im img{width:100%;height:100%;min-height:96px;object-fit:cover;display:block}
.card .bd{padding:10px 12px;min-width:0;flex:1}
.t{font-weight:650}.mu{color:var(--mu);font-size:13px}
.pr{color:var(--ac);font-weight:700}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);margin-right:4px}
h3{font-size:13px;color:var(--mu);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.row{padding:11px 13px;display:block}
.empty{text-align:center;color:var(--mu);padding:36px 10px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 16px rgba(0,0,0,.25);padding:13px 20px;border-radius:99px}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#m[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 4px;font-size:18px}
.ph{display:flex;gap:8px;overflow-x:auto;margin:8px 0}
.ph img{height:150px;border-radius:10px;flex:none}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1}
.kv{margin:8px 0}.kv b{display:block;font-size:12px;color:var(--mu);font-weight:500}
#ts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.ti{pointer-events:auto;background:var(--ac);color:var(--acx);padding:12px 14px;border-radius:12px;max-width:520px;width:100%;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer;font-weight:600}
#nt{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:0 0 10px;color:var(--mu);font-size:13px}
#nt:empty{display:none}
#au{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}#au[hidden]{display:none}#au .box{width:100%;max-width:380px}
</style></head><body>
<div id="ts"></div>
<header><h1>🏠 Emlak Portföy</h1><div style="display:flex;gap:6px"><button class="btn g" data-a="prof" id="bp">👤 Profil</button><button class="btn g" data-a="notif" id="bn">🔔 Bildirim</button></div></header>
<nav><button data-a="tab" data-i="p" class="on">Portföy</button><button data-a="tab" data-i="a">Randevular</button><button data-a="tab" data-i="s">Daire Arayanlar</button><button data-a="tab" data-i="c">Aramalar</button></nav>
<main><div id="nt"></div><div id="main"><p class="empty">Yükleniyor…</p></div></main>
<button class="btn fab" data-a="add" id="fab">+ Daire ekle</button>
<div id="m" hidden></div><div id="au" hidden></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,me='',names={},L=[],A=[],C=[],S=[],U={},reg=0,tab='p',q='',tickTimer=0;
const nm=id=>(U[id]&&U[id].name)||names[id]||'Bir kullanıcı';
const note=t=>{$('#nt').textContent=t};
const hm=s=>String(s).slice(11,16).replace(':','.');
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dl=s=>new Date(s).toLocaleDateString('tr-TR',{weekday:'short',day:'numeric',month:'long'});
const money=n=>n?Number(n).toLocaleString('tr-TR')+' ₺':'';
const priceInput=n=>{const d=String(n==null?'':n).replace(/\D/g,'');return d?Number(d).toLocaleString('tr-TR'):''};
const priceValue=n=>Number(String(n||'').replace(/\D/g,''))||0;
let mem={};
const seen=k=>{try{return localStorage.getItem('s'+k)}catch(e){return mem[k]}};
const mark=k=>{try{localStorage.setItem('s'+k,'1')}catch(e){mem[k]=1}};

async function resolve(){
  const ids=[...new Set([...L,...A,...C].map(x=>x.by).filter(Boolean))].filter(i=>!(i in names));
  if(!ids.length)return;
}
function sub(c,set){
  const t=setTimeout(()=>note('Veriler henüz alınamadı; çevrim dışı olabilirsiniz, bilgiler güncel olmayabilir.'),10000);
  db.collection(c).onSnapshot(s=>{clearTimeout(t);note('');set(s.docs.map(d=>Object.assign({id:d.id},d.data())));render();resolve()},
    e=>{clearTimeout(t);note('Bağlantı hatası: '+((e&&e.message)||'bilinmeyen'))});
}
const sb=(CFG.url&&CFG.key)?supabase.createClient(CFG.url,CFG.key):null;
const normalEmail=e=>String(e||'').trim().toLowerCase();
async function permitted(e){
  const email=normalEmail(e),local=Array.isArray(CFG.allowedEmails)?CFG.allowedEmails.map(normalEmail):[];
  if(!local.length||local.includes(email))return true;
  try{const r=await sb.from('staff_emails').select('email').eq('email',email).maybeSingle();return !!r.data}catch(err){return false}
}
let pend=new URLSearchParams(location.search).get('a');
const mk=c=>({
 onSnapshot(next,err){const load=async()=>{const r=await sb.from('docs').select('id,data').eq('col',c);if(r.error)return err&&err(r.error);next({docs:r.data.map(x=>({id:x.id,data:()=>x.data}))})};
  load();const ch=sb.channel('r-'+c).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'col=eq.'+c},load).subscribe();return()=>sb.removeChannel(ch)},
 async add(d){const r=await sb.from('docs').insert({col:c,data:d});if(r.error)throw r.error}});
if(sb)db={collection:mk,doc(p){const[c,id]=p.split('/');return{
 async set(d){const r=await sb.from('docs').upsert({id,col:c,data:d});if(r.error)throw r.error},
 async delete(){const r=await sb.from('docs').delete().eq('id',id);if(r.error)throw r.error}}}};

function render(){if(pend&&A.find(a=>a.id===pend)){const i=pend;pend=null;setTimeout(()=>act.va(i),0)}
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.i===tab));
  $('#fab').textContent=tab==='p'?'+ Daire ekle':tab==='a'?'+ Randevu ekle':tab==='s'?'+ Daire arayan ekle':'+ Arama ekle';
  const el=$('#main'),act=document.activeElement&&document.activeElement.id==='q';
  if(tab==='p'){
    const f=L.filter(x=>(x.title+' '+x.address+' '+x.rooms+' '+x.phone+' '+(x.owner||x.cname||'')).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(b.at||0)-(a.at||0));
    el.innerHTML='<div class="bar"><input id="q" placeholder="Ara: başlık, adres, telefon…" value="'+esc(q)+'"></div>'+
    (f.length?f.map(x=>'<div class="card" data-a="vl" data-i="'+x.id+'"><div class="bd" style="padding-left:16px"><div class="t">'+esc(x.title)+'</div><div class="pr">'+money(x.price)+'</div><div class="mu">'+esc([x.rooms,x.m2?x.m2+' net m²':''].filter(Boolean).join(' · '))+'</div><div class="mu">'+esc(x.address)+'</div><div style="margin-top:4px"><span class="tag">'+esc(x.kind||'Satılık')+'</span><span class="tag">'+esc(nm(x.by))+'</span></div></div></div>').join(''):'<p class="empty">Henüz daire yok. “+ Daire ekle” ile ilk kaydı oluşturun.</p>');
    if(act){const i=$('#q');i.focus();i.setSelectionRange(q.length,q.length)}
  }else if(tab==='a'){
    const now=new Date(),td=dk(now),s=[...A].sort((a,b)=>a.start<b.start?-1:1);
    const g=(t,l,fn)=>{const r=s.filter(fn);return r.length?'<h3>'+t+'</h3>'+r.map(rowA).join(''):''};
    el.innerHTML=(g('Bugün','',a=>a.start.slice(0,10)===td)+g('Yaklaşan','',a=>a.start.slice(0,10)>td)+g('Geçmiş','',a=>a.start.slice(0,10)<td).split('</h3>').map((x,i)=>x).join('</h3>'))||'<p class="empty">Randevu yok.</p>';
  }else if(tab==='s'){
    const f=S.filter(x=>(x.name+' '+x.phone+' '+x.area+' '+x.rooms+' '+x.floor).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(b.at||0)-(a.at||0));
    el.innerHTML='<div class="bar"><input id="q" placeholder="Ara: ad, telefon, bölge…" value="'+esc(q)+'"></div>'+
      (f.length?f.map(x=>'<div class="card row" data-a="vs" data-i="'+x.id+'" style="display:block"><div class="t">'+esc(x.name)+'</div><div class="mu">'+esc([x.kind,x.rooms,x.area].filter(Boolean).join(' · '))+'</div><div class="mu">'+esc([x.minM2||x.maxM2?(x.minM2||'')+(x.maxM2?'–'+x.maxM2:'')+' net m²':'',x.floor].filter(Boolean).join(' · '))+'</div><div style="margin-top:4px"><span class="tag">'+esc(x.balcony||'Balkon fark etmez')+'</span><span class="tag">'+esc(nm(x.by))+'</span></div></div>').join(''):'<p class="empty">Henüz daire arayan kaydı yok. “+ Daire arayan ekle” ile ilk kaydı oluşturun.</p>');
    if(act){const i=$('#q');i.focus();i.setSelectionRange(q.length,q.length)}
  }else{
    const s=[...C].sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,10);
    el.innerHTML='<div id="nt" style="display:block">Tüm çalışanların son 10 arama kaydı burada görünür. Yeni kaydı “+ Arama ekle” ile ekleyebilirsiniz.</div>'+
    (s.length?s.map(c=>'<div class="card row" style="display:block"><div class="t">'+esc(c.name||c.number)+' <span class="tag">'+esc(c.dir)+'</span></div><div class="mu">'+esc(c.number)+' · '+new Date(c.at).toLocaleString('tr-TR',{dateStyle:'medium',timeStyle:'short'})+' · '+esc(nm(c.by))+'</div>'+(c.note?'<div>'+esc(c.note)+'</div>':'')+'</div>').join(''):'<p class="empty">Arama kaydı yok.</p>');
  }
}
function rowA(a){return '<div class="card row" data-a="va" data-i="'+a.id+'" style="display:block"><div class="t">'+hm(a.start)+' · '+esc(a.customer)+'</div><div class="mu">'+dl(a.start)+' · '+esc(nm(a.by))+(a.note?' · '+esc(a.note):'')+'</div></div>'}

function modal(h){const m=$('#m');m.innerHTML='<div class="sheet">'+h+'</div>';m.hidden=false}
function closeM(){$('#m').hidden=true;$('#m').innerHTML=''}
const fld=(l,id,t,v)=>'<label>'+l+'</label><input id="'+id+'" type="'+(t||'text')+'" value="'+esc(v||'')+'">';

function formL(x){
  modal('<h2>'+(x?'Daireyi düzenle':'Yeni daire')+'</h2>'+fld('Başlık *','f_t','text',x&&x.title)+
  '<label>Tür</label><select id="f_k"><option'+(!x||x.kind!=='Kiralık'?' selected':'')+'>Satılık</option><option'+(x&&x.kind==='Kiralık'?' selected':'')+'>Kiralık</option></select>'+
  '<label>Fiyat (₺)</label><input id="f_p" type="text" inputmode="numeric" value="'+esc(priceInput(x&&x.price))+'">'+fld('Oda sayısı (örn. 3+1)','f_r','text',x&&x.rooms)+fld('Net m²','f_m','number',x&&x.m2)+
  '<label>Cephe</label><input id="f_fr" type="text" placeholder="Örn. Güney / Doğu" value="'+esc(x&&x.front)+'">'+
  '<label>Balkon</label><select id="f_b"><option value="Var"'+(!x||x.balcony!=='Yok'?' selected':'')+'>Var</option><option value="Yok"'+(x&&x.balcony==='Yok'?' selected':'')+'>Yok</option></select>'+fld('Banyo sayısı','f_ba','number',x&&x.bathrooms)+fld('Adres','f_ad','text',x&&x.address)+
  fld('Mal sahibi','f_own','text',x&&(x.owner||x.cname))+fld('İletişim numarası','f_ph','tel',x&&x.phone)+
  '<label>Notlar</label><textarea id="f_n">'+esc(x&&x.notes)+'</textarea>'+
  '<div class="acts"><button class="btn g" data-a="x">Vazgeç</button><button class="btn" data-a="'+(x?'ul':'sl')+'"'+(x?' data-i="'+x.id+'"':'')+'>Kaydet</button></div>');
}
function formA(a){
  const ls=L.map(x=>'<option value="'+x.id+'"'+(a&&a.listing===x.id?' selected':'')+'>'+esc(x.title)+'</option>').join('');
  const d=new Date(Date.now()+3600e3);d.setMinutes(0);
  modal('<h2>'+(a?'Randevuyu düzenle':'Yeni randevu')+'</h2>'+fld('Müşteri adı *','a_c','text',a&&a.customer)+fld('Müşteri telefonu','a_p','tel',a&&a.phone)+
  fld('Tarih ve saat *','a_s','datetime-local',a&&a.start||dk(d)+'T'+String(d.getHours()).padStart(2,'0')+':00')+
  '<label>İlgili daire</label><select id="a_l"><option value="">—</option>'+ls+'</select>'+
  '<label>Not</label><textarea id="a_n">'+esc(a&&a.note)+'</textarea><div class="acts"><button class="btn g" data-a="x">Vazgeç</button><button class="btn" data-a="'+(a?'ua':'sa')+'"'+(a?' data-i="'+a.id+'"':'')+'>Kaydet</button></div>');
}
function formC(){
  modal('<h2>Arama kaydı</h2>'+fld('Numara *','c_n','tel')+fld('Kişi adı','c_a')+
  '<label>Yön</label><select id="c_d"><option>Gelen</option><option>Giden</option><option>Cevapsız</option></select>'+
  '<label>Not</label><textarea id="c_t"></textarea><div class="acts"><button class="btn g" data-a="x">Vazgeç</button><button class="btn" data-a="sc">Kaydet</button></div>');
}
function formS(x){
  const opt=(vals,selected)=>vals.map(z=>'<option'+(z===selected?' selected':'')+'>'+z+'</option>').join('');
  modal('<h2>'+(x?'Daire arayanı düzenle':'Daire arayan')+'</h2>'+fld('Ad soyad *','s_n','text',x&&x.name)+fld('İletişim numarası *','s_p','tel',x&&x.phone)+
  '<label>Aradığı işlem</label><select id="s_k">'+opt(['Satılık','Kiralık','Fark etmez'],x&&x.kind||'Satılık')+'</select>'+
  '<label>Aradığı taşınmaz türü</label><select id="s_ty">'+opt(['Daire','Rezidans','Villa','Müstakil ev','Yazlık','Dubleks','Ofis','Dükkan','Arsa','Fark etmez'],x&&x.type||'Daire')+'</select>'+
  '<label>Oda tercihi</label><select id="s_r">'+opt(['1+0','1+1','2+1','2+1 ve üzeri','3+1','3+1 ve üzeri','4+1','5+1 ve üzeri','Fark etmez'],x&&x.rooms||'Fark etmez')+'</select>'+
  '<div class="grid"><div>'+fld('En az net m²','s_mn','number',x&&x.minM2)+'</div><div>'+fld('En çok net m²','s_mx','number',x&&x.maxM2)+'</div></div>'+
  '<div class="grid"><div><label>En az bütçe (₺)</label><input id="s_bn" type="text" inputmode="numeric" value="'+esc(priceInput(x&&x.minBudget))+'"></div><div><label>En çok bütçe (₺)</label><input id="s_bx" type="text" inputmode="numeric" value="'+esc(priceInput(x&&x.maxBudget))+'"></div></div>'+
  '<label>Kat tercihi</label><select id="s_f">'+opt(['Fark etmez','Giriş kat veya üzeri (zemin/bodrum olmasın)','Sadece giriş kat','Sadece ara kat','Ara kat veya yüksek kat','Yüksek kat tercih','Zemin kat olur','Bodrum kat olur','Asansörlü üst kat','Çatı katı / dubleks'],x&&x.floor||'Fark etmez')+'</select>'+
  '<label>Balkon tercihi</label><select id="s_b">'+opt(['Fark etmez','Balkonlu olmalı','Balkon olmasa da olur','Balkonsuz tercih'],x&&x.balcony||'Fark etmez')+'</select>'+
  '<label>Asansör tercihi</label><select id="s_e">'+opt(['Fark etmez','Asansörlü olmalı','Asansör olmasa da olur'],x&&x.elevator||'Fark etmez')+'</select>'+
  '<label>Eşya tercihi</label><select id="s_fu">'+opt(['Fark etmez','Eşyalı','Eşyasız'],x&&x.furnished||'Fark etmez')+'</select>'+fld('Tercih edilen bölge / mahalle','s_a','text',x&&x.area)+
  '<label>Ek istekler ve notlar</label><textarea id="s_no">'+esc(x&&x.notes)+'</textarea><div class="acts"><button class="btn g" data-a="x">Vazgeç</button><button class="btn" data-a="'+(x?'us':'ss')+'"'+(x?' data-i="'+x.id+'"':'')+'>Kaydet</button></div>');
}
const v=id=>($('#'+id)||{}).value||'';
async function save(c,d){try{await db.collection(c).add(Object.assign(d,{by:me,at:Date.now()}));closeM()}catch(e){alert('Kaydedilemedi: '+((e&&e.message)||e))}}
async function replace(c,x,d){try{await db.doc(c+'/'+x.id).set(Object.assign(d,{by:x.by,at:x.at,updatedAt:Date.now()}));closeM()}catch(e){alert('Kaydedilemedi: '+((e&&e.message)||e))}}

const act={
  tab(i){tab=i;render()},
  x:closeM,
  prof(){const u=U[me]||{};modal('<h2>'+(u.name?'Profilim':'Kayıt ol')+'</h2><div class="mu">Adınız, ilanlarda ve randevu bildirimlerinde görünür.</div>'+fld('Ad Soyad *','u_n','text',u.name)+fld('Telefon','u_p','tel',u.phone)+'<label>Görev</label><select id="u_r"><option>Danışman</option><option>Yönetici</option></select><div class="acts"><button class="btn g" data-a="staff">Çalışanlar</button></div><div class="acts"><button class="btn g" data-a="x">Kapat</button><button class="btn d" data-a="out">Çıkış</button><button class="btn" data-a="su">Kaydet</button></div>');if(u.role)$('#u_r').value=u.role},
  async staff(){
    const base=Array.isArray(CFG.allowedEmails)?CFG.allowedEmails.map(normalEmail):[];
    const r=await sb.from('staff_emails').select('email').order('email');
    if(r.error)return alert('Çalışan listesi alınamadı: '+r.error.message);
    const emails=[...new Set([...base,...(r.data||[]).map(x=>normalEmail(x.email))])].filter(Boolean).sort();
    modal('<h2>Çalışanlar</h2><div class="mu">E-posta eklenen kişi kendi şifresini oluşturarak uygulamaya kayıt olabilir.</div><label>Yeni çalışan e-postası</label><input id="s_e" type="email" inputmode="email" placeholder="ornek@firma.com"><div class="acts"><button class="btn" data-a="sadd">E-posta ekle</button></div><h3>Kayıtlı çalışanlar</h3>'+(emails.length?emails.map(e=>'<div class="card row" style="display:block"><div class="t">'+esc(e)+'</div></div>').join(''):'<p class="empty">Henüz çalışan eklenmemiş.</p>')+'<div class="acts"><button class="btn g" data-a="x">Kapat</button></div>');
  },

  ul(i){const x=L.find(y=>y.id===i);if(!x||x.by!==me)return;const d={title:v('f_t').trim(),kind:v('f_k'),price:priceValue(v('f_p')),rooms:v('f_r'),m2:+v('f_m')||0,front:v('f_fr'),balcony:v('f_b'),bathrooms:+v('f_ba')||0,address:v('f_ad'),owner:v('f_own'),phone:v('f_ph'),notes:v('f_n')};if(!d.title)return alert('Başlık gerekli.');replace('listings',x,d)},
  ss(){if(!v('s_n').trim()||!v('s_p').trim())return alert('Ad soyad ve iletişim numarası gerekli.');save('seekers',{name:v('s_n').trim(),phone:v('s_p'),kind:v('s_k'),type:v('s_ty'),rooms:v('s_r'),minM2:+v('s_mn')||0,maxM2:+v('s_mx')||0,minBudget:priceValue(v('s_bn')),maxBudget:priceValue(v('s_bx')),floor:v('s_f'),balcony:v('s_b'),elevator:v('s_e'),furnished:v('s_fu'),area:v('s_a'),notes:v('s_no')})},
  es(i){const x=S.find(y=>y.id===i);if(x&&x.by===me)formS(x)},
  us(i){const x=S.find(y=>y.id===i);if(!x||x.by!==me)return;if(!v('s_n').trim()||!v('s_p').trim())return alert('Ad soyad ve iletişim numarası gerekli.');replace('seekers',x,{name:v('s_n').trim(),phone:v('s_p'),kind:v('s_k'),type:v('s_ty'),rooms:v('s_r'),minM2:+v('s_mn')||0,maxM2:+v('s_mx')||0,minBudget:priceValue(v('s_bn')),maxBudget:priceValue(v('s_bx')),floor:v('s_f'),balcony:v('s_b'),elevator:v('s_e'),furnished:v('s_fu'),area:v('s_a'),notes:v('s_no')})},
  sa(){if(!v('a_c').trim()||!v('a_s'))return alert('Müşteri adı ve tarih/saat gerekli.');
    save('appointments',{customer:v('a_c').trim(),phone:v('a_p'),start:v('a_s'),listing:v('a_l'),note:v('a_n')})},
  ea(i){const a=A.find(y=>y.id===i);if(a&&a.by===me)formA(a)},
  ua(i){const a=A.find(y=>y.id===i);if(!a||a.by!==me)return;if(!v('a_c').trim()||!v('a_s'))return alert('Müşteri adı ve tarih/saat gerekli.');replace('appointments',a,{customer:v('a_c').trim(),phone:v('a_p'),start:v('a_s'),listing:v('a_l'),note:v('a_n')})},
  sc(){if(!v('c_n').trim())return alert('Numara gerekli.');save('calls',{number:v('c_n').trim(),name:v('c_a'),dir:v('c_d'),note:v('c_t')})},
  vl(i){const x=L.find(y=>y.id===i);if(!x)return;
    modal('<h2>'+esc(x.title)+'</h2><div class="pr">'+money(x.price)+' <span class="tag">'+esc(x.kind)+'</span></div>'+
    '<div class="kv"><b>Oda / Net m²</b>'+esc([x.rooms,x.m2?x.m2+' net m²':''].filter(Boolean).join(' · ')||'—')+'</div>'+
    '<div class="kv"><b>Cephe</b>'+esc(x.front||'—')+'</div><div class="kv"><b>Balkon</b>'+esc(x.balcony||'—')+'</div><div class="kv"><b>Banyo sayısı</b>'+esc(x.bathrooms||'—')+'</div>'+
    '<div class="kv"><b>Adres</b>'+esc(x.address||'—')+'</div>'+
    '<div class="kv"><b>Mal sahibi</b>'+esc(x.owner||x.cname||'')+' '+(x.phone?'<a href="tel:'+esc(x.phone)+'" style="color:var(--ac)">'+esc(x.phone)+'</a>':'—')+'</div>'+
    (x.notes?'<div class="kv"><b>Notlar</b>'+esc(x.notes)+'</div>':'')+
    '<div class="kv"><b>Ekleyen</b>'+esc(nm(x.by))+' · '+new Date(x.at).toLocaleDateString('tr-TR')+'</div>'+
    '<div class="acts"><button class="btn g" data-a="x">Kapat</button>'+(x.by===me?'<button class="btn g" data-a="el" data-i="'+x.id+'">Düzenle</button><button class="btn d" data-a="dl" data-i="'+x.id+'">Sil</button>':'')+'</div>')},
  vs(i){const x=S.find(y=>y.id===i);if(!x)return;const budget=[x.minBudget?money(x.minBudget):'',x.maxBudget?money(x.maxBudget):''].filter(Boolean).join(' – ')||'—';modal('<h2>'+esc(x.name)+'</h2><div class="kv"><b>İletişim</b><a href="tel:'+esc(x.phone)+'" style="color:var(--ac)">'+esc(x.phone)+'</a></div><div class="kv"><b>Aradığı</b>'+esc([x.kind,x.type,x.rooms].filter(Boolean).join(' · '))+'</div><div class="kv"><b>Net m²</b>'+esc([x.minM2||'—',x.maxM2||'—'].join(' – '))+'</div><div class="kv"><b>Bütçe</b>'+esc(budget)+'</div><div class="kv"><b>Kat tercihi</b>'+esc(x.floor||'—')+'</div><div class="kv"><b>Özellikler</b>'+esc([x.balcony,x.elevator,x.furnished].filter(Boolean).join(' · ')||'—')+'</div><div class="kv"><b>Bölge</b>'+esc(x.area||'—')+'</div>'+(x.notes?'<div class="kv"><b>Notlar</b>'+esc(x.notes)+'</div>':'')+'<div class="acts"><button class="btn g" data-a="x">Kapat</button>'+(x.by===me?'<button class="btn g" data-a="es" data-i="'+x.id+'">Düzenle</button>':'')+'</div>')},
  va(i){const a=A.find(y=>y.id===i);if(!a)return;const l=L.find(y=>y.id===a.listing);
    modal('<h2>Randevu</h2><div class="kv"><b>Müşteri</b>'+esc(a.customer)+(a.phone?' · <a href="tel:'+esc(a.phone)+'" style="color:var(--ac)">'+esc(a.phone)+'</a>':'')+'</div>'+
    '<div class="kv"><b>Zaman</b>'+dl(a.start)+' · '+hm(a.start)+'</div><div class="kv"><b>Randevuyu alan</b>'+esc(nm(a.by))+'</div>'+
    (l?'<div class="kv"><b>Daire</b>'+esc(l.title)+' — '+esc(l.address||'')+'</div>':'')+(a.note?'<div class="kv"><b>Not</b>'+esc(a.note)+'</div>':'')+
    '<div class="acts"><button class="btn g" data-a="x">Kapat</button>'+(a.by===me?'<button class="btn g" data-a="ea" data-i="'+a.id+'">Düzenle</button><button class="btn d" data-a="da" data-i="'+a.id+'">Sil</button>':'')+'</div>')},
  async dl(i){if(confirm('Bu daire silinsin mi?')){try{await db.doc('listings/'+i).delete();closeM()}catch(e){alert('Silinemedi')}}},
  async da(i){if(confirm('Bu randevu silinsin mi?')){try{await db.doc('appointments/'+i).delete();closeM()}catch(e){alert('Silinemedi')}}},
  async notif(){push(true)},
  async go(i){const e=v('g_e').trim(),p=v('g_p'),n=v('g_n').trim(),E=t=>{$('#ge').textContent=t};
    if(!e||p.length<6)return E('E-posta ve en az 6 karakterli şifre gerekli.');
    if(i!=='1'&&!n)return E('Ad Soyad gerekli.');
    if(!(await permitted(e)))return E('Bu uygulama yalnızca tanımlı çalışanların e-posta adresleriyle kullanılabilir.');
    const signupOptions={data:{name:n}},redirectTo=location.protocol==='https:'?location.origin+location.pathname:'';if(redirectTo)signupOptions.emailRedirectTo=redirectTo;
    let r;try{r=i==='1'?await sb.auth.signInWithPassword({email:e,password:p}):await sb.auth.signUp({email:e,password:p,options:signupOptions})}catch(err){return E('Sunucuya bağlanılamadı. İnternetinizi kontrol edip tekrar deneyin.')}
    if(r.error){const m=String(r.error.message||'');if(/rate limit/i.test(m))return E('Çok fazla deneme yapıldı. Birkaç dakika bekleyip tekrar deneyin.');if(/already registered|already been registered/i.test(m))return E('Bu e-posta ile kayıt zaten var. “Zaten hesabım var” seçeneğinden giriş yapın.');return E('Kayıt yapılamadı: '+m)}
    if(i!=='1'&&r.data.user&&Array.isArray(r.data.user.identities)&&!r.data.user.identities.length)return E('Bu e-posta ile kayıt zaten var. “Zaten hesabım var” seçeneğinden giriş yapın.');
    if(!r.data.session)return E('Kayıt oluşturuldu. E-postanıza gelen onay bağlantısını (spam klasörünü de kontrol edin) açın; ardından giriş yapın.');
    boot(r.data.session)},
  sw(i){showAuth(i==='1')},
  async out(){await sb.auth.signOut();location.reload()}
};
document.addEventListener('click',e=>{
  if(e.target.id==='m')return closeM();
  const t=e.target.closest('[data-a]');if(t&&act[t.dataset.a])act[t.dataset.a](t.dataset.i)});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;render()}if(['f_p','s_bn','s_bx'].includes(e.target.id))e.target.value=priceInput(e.target.value)});

/* Hatırlatmalar: randevudan 1 saat önce + her gün 10:00 özeti (sayfa/uygulama açıkken) */
function toast(msg,fn){const d=document.createElement('div');d.className='ti';d.textContent=msg;d.onclick=()=>{d.remove();fn()};$('#ts').appendChild(d);setTimeout(()=>d.remove(),60000)}
function ping(a,msg){
  toast(msg,()=>act.va(a.id));
  try{if('Notification' in window&&Notification.permission==='granted'){const n=new Notification('Randevu hatırlatma',{body:msg});n.onclick=()=>{window.focus();act.va(a.id)}}}catch(e){}
}
const msg=a=>nm(a.by)+' bugün saat '+hm(a.start)+'’da '+a.customer+' ile randevunuz var.';
function tick(){
  const now=new Date(),td=dk(now);
  A.forEach(a=>{const d=new Date(a.start)-now;if(d>0&&d<=3600e3&&!seen('h'+a.id)){mark('h'+a.id);ping(a,'1 saat kaldı: '+msg(a))}});
  if(now.getHours()>=10&&!seen('d'+td)&&A.length){
    mark('d'+td);
    A.filter(a=>a.start.slice(0,10)===td&&new Date(a.start)>now).sort((a,b)=>a.start<b.start?-1:1).forEach(a=>ping(a,msg(a)));
  }
}

function showAuth(sig){$('#au').hidden=false;$('#au').innerHTML='<div class="box"><h1 style="margin-bottom:12px">🏠 Emlak Portföy</h1>'+(sig?'':fld('Ad Soyad *','g_n'))+fld('E-posta','g_e','email')+fld('Şifre (en az 6 karakter)','g_p','password')+'<div id="ge" class="mu" style="color:var(--wa);margin-top:8px"></div><div class="acts"><button class="btn" data-a="go" data-i="'+(sig?1:0)+'">'+(sig?'Giriş yap':'Kayıt ol')+'</button></div><div class="acts"><button class="btn g" data-a="sw" data-i="'+(sig?0:1)+'">'+(sig?'Hesabım yok, kayıt ol':'Zaten hesabım var')+'</button></div></div>'}
async function boot(s){
  me=s.user.id;$('#au').hidden=true;
  sub('listings',x=>L=x);sub('appointments',x=>A=x);sub('seekers',x=>S=x);sub('calls',x=>C=x);
  sub('users',x=>{U={};x.forEach(u=>U[u.id]=u);if(!reg){reg=1;if(!U[me])auto(s)}});
  if(navigator.serviceWorker)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.open){pend=e.data.open;render()}});
  push(false).catch(()=>{});
  tick();if(!tickTimer)tickTimer=setInterval(tick,60000);
}
async function auto(s){const n=(s.user.user_metadata||{}).name;if(n){try{await db.doc('users/'+me).set({name:n,role:'Danışman',at:Date.now()})}catch(e){}}else act.prof()}
const b64=s=>{const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function push(ask){
  if(!('serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window)){if(ask)alert('Bu tarayıcı bildirimi desteklemiyor. iPhone’da önce Safari’de Paylaş → “Ana Ekrana Ekle” yapın, uygulamayı ana ekrandaki simgeden açın.');return}
  if(!CFG.vapid){if(ask)alert('Bildirim anahtarı henüz ayarlanmamış.');return}
  const w=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
  if(Notification.permission!=='granted'){if(!ask)return;if(await Notification.requestPermission()!=='granted')return}
  const ps=(await w.pushManager.getSubscription())||(await w.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(CFG.vapid)}));
  const r=await sb.from('push_subs').upsert({endpoint:ps.toJSON().endpoint,sub:ps.toJSON()});
  if(r.error){if(ask)alert('Kaydedilemedi: '+r.error.message);return}
  $('#bn').hidden=true;if(ask)alert('Bildirimler açıldı ✅');
}
if(!sb)$('#main').innerHTML='<p class="empty">config.js dosyasına Supabase bilgilerinizi yazın.</p>';
else sb.auth.getSession().then(r=>r.data.session?boot(r.data.session):showAuth(true));
</script></body></html>
